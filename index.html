// ─── Proxy Server API ───
// ⚠️ 프록시 서버 URL — 배포 후 이 한 줄만 수정하세요
//   배포 예시: "https://your-app.up.railway.app"
const PRODUCTION_PROXY_URL = "https://naver-ad-proxy.lim5829.workers.dev";

// 개발자용 백도어: 브라우저 콘솔에서 아래처럼 override 가능
//   localStorage.setItem("__dev_proxy_url", "http://192.168.0.10:3001")
//   localStorage.removeItem("__dev_proxy_url")  // 원래대로
const PROXY_BASE = localStorage.getItem("__dev_proxy_url") || PRODUCTION_PROXY_URL;

async function naverApiFetch({ method = "GET", path, customerId, apiKey, secretKey, managerLoginId, body }) {
  const headers = {
    "Content-Type": "application/json",
    "X-Customer-Id": customerId,
    "X-Api-Key": apiKey,
    "X-Secret-Key": secretKey,
  };
  if (managerLoginId) headers["X-Manager-Login-Id"] = managerLoginId;

  const res = await fetch(`${PROXY_BASE}${path}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `API Error: ${res.status}`);
  }
  return res.json();
}

// ─── Background ───
function SoftBG() {
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", pointerEvents: "none" }}>
      <div style={{ position: "absolute", top: "-25%", right: "-20%", width: "65vw", height: "65vw", borderRadius: "50%", background: "radial-gradient(circle, rgba(3,199,90,0.07) 0%, transparent 65%)", animation: "driftA 22s ease-in-out infinite" }} />
      <div style={{ position: "absolute", bottom: "-20%", left: "-15%", width: "55vw", height: "55vw", borderRadius: "50%", background: "radial-gradient(circle, rgba(66,133,244,0.05) 0%, transparent 65%)", animation: "driftB 28s ease-in-out infinite" }} />
      <style>{`
        @keyframes driftA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-20px,30px)} }
        @keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(15px,-25px)} }
      `}</style>
    </div>
  );
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
  const c = type === "success" ? theme.accent : type === "error" ? theme.danger : theme.textDim;
  return (
    <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", zIndex: 9999, background: theme.surface, color: c, border: `1.5px solid ${c}33`, borderRadius: 14, padding: "12px 28px", fontSize: 14, fontWeight: 700, boxShadow: `0 8px 30px rgba(0,0,0,0.1)`, animation: "popIn 0.3s ease" }}>
      {message}
      <style>{`@keyframes popIn { from{opacity:0;transform:translateX(-50%) translateY(-16px) scale(0.95)} to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} }`}</style>
    </div>
  );
}

function InputField({ icon, label, type = "text", value, onChange, placeholder, showToggle, mono }) {
  const [focused, setFocused] = useState(false);
  const [showPw, setShowPw] = useState(false);
  const actualType = showToggle ? (showPw ? "text" : "password") : type;
  return (
    <div style={{ marginBottom: 18 }}>
      <label style={{ display: "block", fontSize: 11.5, fontWeight: 700, color: theme.textDim, marginBottom: 7, letterSpacing: "0.06em", textTransform: "uppercase" }}>{label}</label>
      <div style={{ display: "flex", alignItems: "center", gap: 10, background: theme.surfaceLight, border: `1.5px solid ${focused ? theme.accent : "transparent"}`, borderRadius: 12, padding: "0 14px", transition: "all 0.2s", boxShadow: focused ? `0 0 0 3px ${theme.accentGlow}` : "none" }}>
        <span style={{ color: focused ? theme.accent : theme.textDim, transition: "color 0.2s", flexShrink: 0 }}>{icon}</span>
        <input type={actualType} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: theme.text, fontSize: 15, padding: "14px 0", fontFamily: mono ? "'JetBrains Mono', monospace" : "inherit", letterSpacing: mono ? "0.02em" : "normal" }} />
        {showToggle && <button onClick={() => setShowPw(!showPw)} style={{ background: "none", border: "none", color: theme.textDim, cursor: "pointer", padding: 4, display: "flex", flexShrink: 0 }}>{showPw ? I.eyeOff : I.eye}</button>}
      </div>
    </div>
  );
}

function Button({ children, onClick, variant = "primary", loading, disabled, style: s }) {
  const base = { width: "100%", padding: "15px 24px", borderRadius: 14, border: "none", fontSize: 15, cursor: disabled ? "not-allowed" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, transition: "all 0.2s", opacity: disabled ? 0.45 : 1, fontWeight: 700 };
  const v = {
    primary: { background: `linear-gradient(135deg, ${theme.accent}, ${theme.accentDark})`, color: "#fff", boxShadow: `0 4px 16px ${theme.accentGlow}` },
    secondary: { background: theme.surfaceLight, color: theme.text, border: `1.5px solid ${theme.border}` },
  };
  return (
    <button onClick={onClick} disabled={disabled || loading} style={{ ...base, ...v[variant], ...s }}>
      {loading ? <span style={{ display: "inline-block", width: 18, height: 18, border: "2.5px solid currentColor", borderTopColor: "transparent", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} /> : children}
      <style>{`@keyframes spin { to { transform: rotate(360deg) } }`}</style>
    </button>
  );
}

function Card({ children, style }) {
  return <div style={{ background: theme.surface, borderRadius: 18, border: `1px solid ${theme.border}`, padding: 24, boxShadow: theme.cardShadow, ...style }}>{children}</div>;
}

function StatusBadge({ status }) {
  const map = {
    ELIGIBLE: { label: "활성", color: theme.accent, bg: theme.accentDim },
    PAUSED: { label: "일시중지", color: theme.warning, bg: theme.warningDim },
    OFF: { label: "중지", color: theme.danger, bg: theme.dangerDim },
    PENDING: { label: "대기", color: theme.blue, bg: theme.blueDim },
    DELETED: { label: "삭제됨", color: theme.textDim, bg: theme.surfaceLight },
  };

    <span style={{ fontSize: 11, fontWeight: 700, color: s.color, background: s.bg, padding: "3px 10px", borderRadius: 20, display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}>

      {labels[type] || type}
    </span>
  );
}

function fmtNum(n) {
  if (n == null) return "-";
  return Number(n).toLocaleString("ko-KR");
}

// ─── Login ───
function LoginPage({ onLogin, onGoSignup }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handleLogin = async () => {
    if (!email || !password) { setError("이메일과 비밀번호를 입력하세요"); return; }
    setLoading(true); setError("");
    await new Promise(r => setTimeout(r, 600));
    const users = JSON.parse(localStorage.getItem("naver-ad-users") || "[]");
    const user = users.find(u => u.email === email && u.password === password);
    if (user) onLogin(user); else setError("이메일 또는 비밀번호가 일치하지 않습니다");
    setLoading(false);
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", padding: "24px 20px" }}>
      <div style={{ textAlign: "center", marginBottom: 44 }}>
        <div style={{ width: 76, height: 76, borderRadius: 22, margin: "0 auto 20px", background: `linear-gradient(135deg, ${theme.accent}, ${theme.accentDark})`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 8px 28px ${theme.accentGlow}` }}>{I.naver}</div>
        <h1 style={{ fontSize: 26, fontWeight: 800, color: theme.text, margin: 0 }}>네이버 광고 관리</h1>
        <p style={{ color: theme.textDim, fontSize: 14, marginTop: 8, fontWeight: 500 }}>Naver Search Ad Manager</p>
      </div>
      <Card>
        <InputField icon={I.mail} label="이메일" type="email" value={email} onChange={setEmail} placeholder="your@email.com" />
        <InputField icon={I.lock} label="비밀번호" value={password} onChange={setPassword} placeholder="••••••••" showToggle />
        {error && <p style={{ color: theme.danger, fontSize: 13, margin: "0 0 14px", padding: "10px 14px", background: theme.dangerDim, borderRadius: 10, fontWeight: 600 }}>{error}</p>}
        <Button onClick={handleLogin} loading={loading}>로그인</Button>
      </Card>
      <p style={{ textAlign: "center", marginTop: 28, color: theme.textDim, fontSize: 14 }}>계정이 없으신가요? <span onClick={onGoSignup} style={{ color: theme.accent, cursor: "pointer", fontWeight: 700 }}>회원가입</span></p>
    </div>
  );
}

// ─── Signup ───
function SignupPage({ onSignup, onGoLogin }) {
  const [name, setName] = useState(""); const [email, setEmail] = useState("");
  const [password, setPassword] = useState(""); const [confirmPw, setConfirmPw] = useState("");
  const [loading, setLoading] = useState(false); const [error, setError] = useState("");

  const validate = () => {
    if (!name.trim()) return "이름을 입력하세요";
    if (!email.includes("@")) return "올바른 이메일 형식이 아닙니다";
    if (password.length < 6) return "비밀번호는 6자 이상이어야 합니다";
    if (password !== confirmPw) return "비밀번호가 일치하지 않습니다";
    return null;
  };

  const handleSignup = async () => {
    const err = validate(); if (err) { setError(err); return; }
    setLoading(true); setError("");
    await new Promise(r => setTimeout(r, 800));
    const users = JSON.parse(localStorage.getItem("naver-ad-users") || "[]");
    if (users.find(u => u.email === email)) { setError("이미 등록된 이메일입니다"); setLoading(false); return; }
    const newUser = { id: Date.now(), name, email, password, createdAt: new Date().toISOString() };
    users.push(newUser);
    localStorage.setItem("naver-ad-users", JSON.stringify(users));
    onSignup(newUser); setLoading(false);
  };

  const pwS = password.length === 0 ? 0 : password.length < 6 ? 1 : password.length < 10 ? 2 : 3;
  const sC = ["transparent", theme.danger, theme.warning, theme.accent];
  const sL = ["", "약함", "보통", "강함"];

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", padding: "24px 20px" }}>
      <div style={{ textAlign: "center", marginBottom: 32 }}>
        <div style={{ width: 76, height: 76, borderRadius: 22, margin: "0 auto 20px", background: `linear-gradient(135deg, ${theme.accent}, ${theme.accentDark})`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 8px 28px ${theme.accentGlow}` }}>{I.naver}</div>
        <h1 style={{ fontSize: 24, fontWeight: 800, color: theme.text, margin: 0 }}>회원가입</h1>
        <p style={{ color: theme.textDim, fontSize: 14, marginTop: 8, fontWeight: 500 }}>새로운 계정을 만들어 보세요</p>
      </div>
      <Card>
        <InputField icon={I.user} label="이름" value={name} onChange={setName} placeholder="홍길동" />
        <InputField icon={I.mail} label="이메일" type="email" value={email} onChange={setEmail} placeholder="your@email.com" />
        <InputField icon={I.lock} label="비밀번호" value={password} onChange={setPassword} placeholder="6자 이상 입력" showToggle />
        {password && (
          <div style={{ marginTop: -10, marginBottom: 18 }}>
            <div style={{ display: "flex", gap: 4, marginBottom: 5 }}>{[1,2,3].map(i => <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= pwS ? sC[pwS] : theme.border, transition: "all 0.3s" }} />)}</div>
            <span style={{ fontSize: 11, color: sC[pwS], fontWeight: 700 }}>{sL[pwS]}</span>
          </div>
        )}
        <InputField icon={I.lock} label="비밀번호 확인" value={confirmPw} onChange={setConfirmPw} placeholder="비밀번호를 다시 입력" showToggle />
        {error && <p style={{ color: theme.danger, fontSize: 13, margin: "0 0 14px", padding: "10px 14px", background: theme.dangerDim, borderRadius: 10, fontWeight: 600 }}>{error}</p>}
        <Button onClick={handleSignup} loading={loading}>계정 만들기</Button>
      </Card>
      <p style={{ textAlign: "center", marginTop: 28, color: theme.textDim, fontSize: 14 }}>이미 계정이 있으신가요? <span onClick={onGoLogin} style={{ color: theme.accent, cursor: "pointer", fontWeight: 700 }}>로그인</span></p>
    </div>
  );
}

// ─── API Settings ───
function ApiSettingsPage({ user, onLogout, onSave, onGoCampaigns, apiSettings }) {
  const [customerId, setCustomerId] = useState(apiSettings?.customerId || "");
  const [apiKey, setApiKey] = useState(apiSettings?.apiKey || "");
  const [secretKey, setSecretKey] = useState(apiSettings?.secretKey || "");
  const [managerLoginId, setManagerLoginId] = useState(apiSettings?.managerLoginId || "");
  const [saved, setSaved] = useState(!!apiSettings?.customerId);
  const [loading, setLoading] = useState(false);
  const [testResult, setTestResult] = useState(null);

  const handleSave = async () => {
    if (!customerId || !apiKey || !secretKey) return;
    setLoading(true);
    await new Promise(r => setTimeout(r, 400));
    const settings = { customerId, apiKey, secretKey, managerLoginId, savedAt: new Date().toISOString() };
    localStorage.setItem(`naver-ad-api-settings-${user.id}`, JSON.stringify(settings));
    setSaved(true); setLoading(false); onSave?.(settings);
  };

  const handleTest = async () => {
    setTestResult(null); setLoading(true);
    try {

// ─── Bid Presets ───
const DEFAULT_PRESETS = [70, 500, 1000, 2000, 5000, 10000];

function PresetManager({ presets, onChange }) {
  const [editing, setEditing] = useState(false);
  const [newValue, setNewValue] = useState("");

  const addPreset = () => {
    const val = parseInt(newValue);
    if (isNaN(val) || val < 70) return;
    if (presets.includes(val)) return;
    onChange([...presets, val].sort((a, b) => a - b));
    setNewValue("");
  };

  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
      {presets.map((p, i) => (
        <span key={i} style={{ fontSize: 11, background: theme.surfaceLight, borderRadius: 6, padding: "4px 8px", display: "inline-flex", alignItems: "center", gap: 3, color: theme.text, fontWeight: 600 }}>
          {fmtNum(p)}
          {editing && <button onClick={() => onChange(presets.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: theme.danger, cursor: "pointer", fontSize: 13, lineHeight: 1, padding: 0, marginLeft: 1 }}>×</button>}
        </span>
      ))}
      {editing ? (
        <>
          <input value={newValue} onChange={e => setNewValue(e.target.value)} placeholder="금액" type="number"
            onKeyDown={e => { if (e.key === "Enter") addPreset(); }}
            style={{ width: 64, background: theme.surfaceLight, border: `1px solid ${theme.border}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, color: theme.text, outline: "none" }} />
          <button onClick={addPreset} style={{ background: theme.accent, color: "#fff", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>+</button>
          <button onClick={() => setEditing(false)} style={{ background: "none", border: "none", color: theme.textDim, cursor: "pointer", fontSize: 11, fontWeight: 600 }}>완료</button>
        </>
      ) : (
        <button onClick={() => setEditing(true)} style={{ background: "none", border: `1px dashed ${theme.border}`, borderRadius: 6, padding: "4px 8px", fontSize: 11, color: theme.textDim, cursor: "pointer", fontWeight: 600 }}>편집</button>
      )}
    </div>
  );
}

// ─── Inline Bid Editor ───
function BidEditor({ adgroup, apiSettings, presets, showToast }) {
  const currentBid = adgroup.bidAmt || adgroup.defaultBid || 0;
  const [bid, setBid] = useState(String(currentBid));
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  const handleSave = async (newBid) => {
    const val = parseInt(newBid);
    if (isNaN(val) || val < 70) { showToast("최소 입찰가는 70원입니다", "error"); return; }
    if (val === currentBid) return;
    setSaving(true);
    try {
      await naverApiFetch({
        method: "PUT",
        path: `/api/adgroups/${adgroup.nccAdgroupId}/bid`,
        ...apiSettings,
        body: { bidAmt: val },
      });
      setBid(String(val));
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
      showToast(`입찰가 ${fmtNum(val)}원으로 변경`);
    } catch (e) {
      showToast(`변경 실패: ${e.message}`, "error");
    }
    setSaving(false);
  };

  const handlePreset = (value) => {
    setBid(String(value));
    handleSave(value);
  };

  return (
    <div>
      {/* Bid Input Row */}
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 6 }}>
        <div style={{ position: "relative", flex: 1 }}>
          <input
            type="number" value={bid}
            onChange={e => { setBid(e.target.value); setSaved(false); }}
            onBlur={() => handleSave(bid)}
            onKeyDown={e => { if (e.key === "Enter") handleSave(bid); }}
            style={{
              width: "100%", background: theme.surfaceLight,
              border: `1.5px solid ${saved ? theme.accent : "transparent"}`,
              borderRadius: 8, padding: "8px 40px 8px 10px",
              fontSize: 14, fontWeight: 700, color: theme.text, outline: "none",
              fontFamily: "'JetBrains Mono', monospace",
              transition: "border-color 0.2s",
            }}
          />
          <span style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", fontSize: 12, color: theme.textDim, fontWeight: 600, pointerEvents: "none" }}>원</span>
        </div>
        {saving && <span style={{ width: 18, height: 18, border: `2px solid ${theme.accent}`, borderTopColor: "transparent", borderRadius: "50%", display: "inline-block", animation: "spin 0.7s linear infinite" }} />}
        {saved && <span style={{ color: theme.accent, display: "flex" }}>{I.check}</span>}
      </div>
      {/* Preset Buttons */}
      <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
        {presets.map((p, i) => (
          <button key={i} onClick={() => handlePreset(p)} style={{
            background: parseInt(bid) === p ? theme.accentDim : theme.surfaceLight,
            border: `1px solid ${parseInt(bid) === p ? theme.accent + "44" : "transparent"}`,
            borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 700,
            color: parseInt(bid) === p ? theme.accent : theme.textDim,
            cursor: "pointer", transition: "all 0.15s", whiteSpace: "nowrap",
          }}>
            {fmtNum(p)}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Campaign Accordion ───
function CampaignAccordion({ campaign, apiSettings, presets, showToast, isFirst, showAll, onPresetsChange }) {
  const [open, setOpen] = useState(false);
  const [adgroups, setAdgroups] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const [errorMsg, setErrorMsg] = useState("");

  const fetchAdgroups = async () => {
    setLoading(true);
    setErrorMsg("");
    try {
      const data = await naverApiFetch({
        path: `/api/adgroups?campaignId=${campaign.nccCampaignId}`,
        ...apiSettings,
      });
      setAdgroups(Array.isArray(data) ? data : []);
    } catch (e) {
      setErrorMsg(e.message);
      showToast(`광고그룹 조회 실패: ${e.message}`, "error");
    }
    setLoaded(true); setLoading(false);
  };

  const toggle = async () => {
    if (!open && !loaded) {
      await fetchAdgroups();
    }
    setOpen(!open);
  };

  // 첫 번째 캠페인 자동 펼침
  useEffect(() => {
    if (isFirst && !loaded) {
      fetchAdgroups().then(() => setOpen(true));
    }
  }, [isFirst]);

  const activeAdgroups = adgroups.filter(a => (a.userStatus || a.status) === "ELIGIBLE");
  const displayAdgroups = showAll ? adgroups : activeAdgroups;
  const activeCount = activeAdgroups.length;

  return (
    <div style={{ marginBottom: 10 }}>
      {/* Campaign Header — name only */}
      <button onClick={toggle} style={{
        width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between",
        background: theme.surface, border: `1px solid ${open ? theme.accent + "33" : theme.border}`,
        borderRadius: open ? "14px 14px 0 0" : 14, padding: "14px 16px",
        cursor: "pointer", transition: "all 0.2s",
        boxShadow: open ? `0 2px 12px ${theme.accentGlow}` : theme.cardShadow,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke={open ? theme.accent : theme.textDim} strokeWidth="2.5" style={{ transition: "transform 0.2s", transform: open ? "rotate(90deg)" : "rotate(0deg)", flexShrink: 0 }}>
            <polyline points="9 18 15 12 9 6" />
          </svg>
          <span style={{ fontSize: 14, fontWeight: 700, color: theme.text, textAlign: "left" }}>{campaign.name}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {loaded && <span style={{ fontSize: 11, color: theme.textDim, fontWeight: 600 }}>{activeCount}/{adgroups.length}</span>}
          {loading && <span style={{ width: 14, height: 14, border: `2px solid ${theme.accent}`, borderTopColor: "transparent", borderRadius: "50%", display: "inline-block", animation: "spin 0.7s linear infinite" }} />}
        </div>
      </button>

      {/* Adgroups Panel */}
      {open && (
        <div style={{
          background: theme.bg, border: `1px solid ${theme.accent}22`, borderTop: "none",
          borderRadius: "0 0 14px 14px", padding: 12,
        }}>
          {loading && (
            <div style={{ textAlign: "center", padding: 20 }}>
              <span style={{ width: 20, height: 20, border: `2.5px solid ${theme.accent}`, borderTopColor: "transparent", borderRadius: "50%", display: "inline-block", animation: "spin 0.7s linear infinite" }} />
            </div>
          )}
          {!loading && displayAdgroups.length > 0 && (
            <div style={{ marginBottom: 8 }}>
              <PresetManager presets={presets} onChange={onPresetsChange} />
            </div>
          )}
          {!loading && adgroups.length > 0 && displayAdgroups.length === 0 && !errorMsg && (
            <div style={{ textAlign: "center", padding: 20, color: theme.textDim, fontSize: 13 }}>활성 광고그룹이 없습니다</div>
          )}
          {!loading && adgroups.length === 0 && !errorMsg && (
            <div style={{ textAlign: "center", padding: 20, color: theme.textDim, fontSize: 13 }}>광고그룹이 없습니다</div>
          )}
          {!loading && errorMsg && (
            <div style={{ textAlign: "center", padding: 16 }}>
              <div style={{ fontSize: 13, color: theme.danger, fontWeight: 600, marginBottom: 8 }}>{errorMsg}</div>
              <button onClick={() => { setLoaded(false); setErrorMsg(""); fetchAdgroups(); }} style={{ background: theme.surfaceLight, border: `1px solid ${theme.border}`, borderRadius: 8, padding: "6px 16px", fontSize: 12, fontWeight: 600, color: theme.text, cursor: "pointer" }}>다시 시도</button>
            </div>
          )}
          {!loading && displayAdgroups.map(ag => (
            <AdgroupRow key={ag.nccAdgroupId} adgroup={ag} apiSettings={apiSettings} presets={presets} showToast={showToast} />
          ))}
        </div>
      )}
      <style>{`@keyframes spin { to { transform: rotate(360deg) } }`}</style>
    </div>
  );
}

          </div>
          <button onClick={() => setShowAll(!showAll)} style={{ background: showAll ? theme.accentDim : theme.surfaceLight, border: `1.5px solid ${showAll ? theme.accent + "33" : theme.border}`, borderRadius: 20, padding: "6px 14px", fontSize: 12, fontWeight: 700, color: showAll ? theme.accent : theme.textDim, cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}>
            {showAll ? <>{I.filter} 활성만</> : <>{I.list} 전체</>}
          </button>
        </div>
      )}

      {/* Loading */}
      {loading && <div><SkeletonCard /><SkeletonCard /><SkeletonCard /><SkeletonCard /></div>}

      {/* Error */}
      {error && (
        <Card style={{ padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 30, marginBottom: 10 }}>⚠️</div>
          <div style={{ fontSize: 14, color: theme.danger, fontWeight: 600, marginBottom: 6 }}>연결 오류</div>
          <div style={{ fontSize: 12, color: theme.textDim, marginBottom: 16, lineHeight: 1.5 }}>{error}</div>
          <Button onClick={() => fetchCampaigns()} variant="secondary">다시 시도</Button>
        </Card>
      )}

      {/* Empty */}
      {!loading && !error && displayCampaigns.length === 0 && (
        <Card style={{ padding: 40, textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>📭</div>
          <div style={{ fontSize: 15, fontWeight: 700, color: theme.text, marginBottom: 6 }}>{showAll ? "캠페인이 없습니다" : "활성 캠페인이 없습니다"}</div>
          {!showAll && inactiveCampaigns.length > 0 && (
            <Button onClick={() => setShowAll(true)} variant="secondary" style={{ width: "auto", padding: "10px 20px", margin: "12px auto 0" }}>{I.list} 전체 보기 ({inactiveCampaigns.length}개)</Button>
          )}
        </Card>
      )}

      {/* Campaign List — Accordion */}
      {!loading && !error && displayCampaigns.map((c, i) => (
        <CampaignAccordion key={c.nccCampaignId || i} campaign={c} apiSettings={apiSettings} presets={presets} showToast={showToast} isFirst={i === 0} showAll={showAll} onPresetsChange={savePresets} />
      ))}
    </div>
  );
}

  const tabs = [
    { id: "campaigns", label: "캠페인", icon: <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> },
    { id: "cost", label: "광고비", icon: <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> },
    { id: "settings", label: "설정", icon: <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> },
  ];
  return (
    <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: theme.surface, borderTop: `1px solid ${theme.border}`, display: "flex", zIndex: 100, paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => onChange(t.id)} style={{
          flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
          padding: "12px 0 10px", background: "none", border: "none", cursor: "pointer",
          color: active === t.id ? theme.accent : theme.textDim, transition: "color 0.2s",

// ─── Mini Bar Chart ───
function MiniChart({ data, color, height = 60 }) {
  if (!data || data.length === 0) return null;
  const max = Math.max(...data.map(d => d.value), 1);
  const barW = Math.min(Math.floor((100 / data.length) - 1), 12);
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height, padding: "4px 0" }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
          <div style={{
            width: "100%", maxWidth: barW, minWidth: 4,
            height: Math.max((d.value / max) * (height - 16), 2),
            background: color || theme.accent, borderRadius: 2,
            opacity: 0.4 + (d.value / max) * 0.6,
            transition: "height 0.3s",
          }} />
          {data.length <= 15 && (
            <span style={{ fontSize: 8, color: theme.textDim, fontWeight: 500 }}>{d.label}</span>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── Cost Page ───
function CostPage({ user, apiSettings, onBack, onLogout, showToast }) {
  const [campaigns, setCampaigns] = useState([]);
  const [stats, setStats] = useState({});
  const [campaignStats, setCampaignStats] = useState({});
  const [dailyData, setDailyData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [expandedPeriod, setExpandedPeriod] = useState(null);
  const [debugInfo, setDebugInfo] = useState({});

  const periods = [
    { key: "today", label: "오늘", preset: "today" },
    { key: "yesterday", label: "어제", preset: "yesterday" },
    { key: "thisMonth", label: "이번달", useRange: true },
    { key: "lastMonth", label: "지난달", preset: "lastmonth" },
  ];

  const getThisMonthRange = () => {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    return { since: `${y}-${m}-01`, until: `${y}-${m}-${String(now.getDate()).padStart(2, "0")}` };
  };

  const getLastMonthRange = () => {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const last = new Date(now.getFullYear(), now.getMonth(), 0);
    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    return { since: fmt(first), until: fmt(last) };
  };

  const fetchStats = async (ids, period) => {
    const fields = '["clkCnt","impCnt","salesAmt","cpc","ctr"]';
    try {
      if (period.useRange) {
        const { since, until } = getThisMonthRange();
        return await naverApiFetch({
          path: `/api/stats-range?ids=${encodeURIComponent(ids)}&fields=${encodeURIComponent(fields)}&since=${since}&until=${until}`,
          ...apiSettings,
        });
      } else {
        return await naverApiFetch({
          path: `/api/stats-summary?ids=${encodeURIComponent(ids)}&fields=${encodeURIComponent(fields)}&datePreset=${period.preset}`,
          ...apiSettings,
        });
      }
    } catch (e) {
      throw e;
    }
  };

  const aggregateStats = (data) => {
    // API 응답이 { data: [...] } 형태일 수 있음
    let arr = [];
    if (Array.isArray(data)) {
      arr = data;
    } else if (data && Array.isArray(data.data)) {
      arr = data.data;
    } else if (data && typeof data === "object") {
      arr = [data];
    }
    const totals = { clkCnt: 0, impCnt: 0, salesAmt: 0, cpc: 0, ctr: 0 };
    arr.forEach(item => {
      totals.clkCnt += Number(item.clkCnt) || 0;
      totals.impCnt += Number(item.impCnt) || 0;
      totals.salesAmt += Number(item.salesAmt) || 0;
    });
    totals.cpc = totals.clkCnt > 0 ? Math.round(totals.salesAmt / totals.clkCnt) : 0;
    totals.ctr = totals.impCnt > 0 ? ((totals.clkCnt / totals.impCnt) * 100).toFixed(2) : "0.00";
    return totals;
  };

  // 응답에서 data 배열 추출
  const extractDataArray = (data) => {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.data)) return data.data;
    if (data && typeof data === "object") return [data];
    return [];
  };

  const fetchAll = useCallback(async () => {
    setLoading(true); setError(""); setDebugInfo({});
    try {
      const campData = await naverApiFetch({ path: "/api/campaigns", ...apiSettings });
      const camps = Array.isArray(campData) ? campData : [];
      setCampaigns(camps);

      if (camps.length === 0) {
        setStats({}); setCampaignStats({}); setDailyData([]);
        setLoading(false);
        return;
      }

      const allIds = camps.map(c => c.nccCampaignId);
      const idsStr = allIds.join(",");
      const results = {};
      const campResults = {};
      const debug = {};

      // 각 기간별 전체 통계
      for (const p of periods) {
        try {
          const data = await fetchStats(idsStr, p);
          const extracted = extractDataArray(data);
          debug[p.key] = { version: "v3", rawType: typeof data, isArray: Array.isArray(data), hasDataProp: !!(data && data.data), extractedLength: extracted.length, firstItem: extracted[0] || null };
          results[p.key] = aggregateStats(data);

          // 캠페인별 분리
          const arr = extractDataArray(data);
          const byCampaign = {};
          arr.forEach(item => {
            const id = item.id || item.nccCampaignId;
            if (!byCampaign[id]) byCampaign[id] = [];
            byCampaign[id].push(item);
          });
          campResults[p.key] = {};
          camps.forEach(c => {
            const items = byCampaign[c.nccCampaignId] || [];
            campResults[p.key][c.nccCampaignId] = items.length > 0 ? aggregateStats(items) : { clkCnt: 0, impCnt: 0, salesAmt: 0, cpc: 0, ctr: "0.00" };
          });
        } catch (e) {
          debug[p.key] = { error: e.message };
          results[p.key] = { clkCnt: 0, impCnt: 0, salesAmt: 0, cpc: 0, ctr: "0.00", error: e.message };
          campResults[p.key] = {};
        }
      }

      // 일별 추이 (이번달)
      try {
        const { since, until } = getThisMonthRange();
        const fields = '["clkCnt","impCnt","salesAmt"]';
        const dailyRaw = await naverApiFetch({
          path: `/api/stats-range?ids=${encodeURIComponent(idsStr)}&fields=${encodeURIComponent(fields)}&since=${since}&until=${until}`,
          ...apiSettings,
        });
        const arr = extractDataArray(dailyRaw);
        // Group by date
        const byDate = {};
        arr.forEach(item => {
          const dt = item.statDt || item.date;
          if (dt) {
            if (!byDate[dt]) byDate[dt] = { clkCnt: 0, salesAmt: 0, impCnt: 0 };
            byDate[dt].clkCnt += Number(item.clkCnt) || 0;
            byDate[dt].salesAmt += Number(item.salesAmt) || 0;
            byDate[dt].impCnt += Number(item.impCnt) || 0;
          }
        });
        const sorted = Object.entries(byDate).sort(([a],[b]) => a.localeCompare(b));
        setDailyData(sorted.map(([dt, v]) => ({
          date: dt,
          label: dt.slice(8),
          ...v,
        })));
        debug.daily = { count: sorted.length, sample: sorted[0] };
      } catch (e) {
        debug.daily = { error: e.message };
        setDailyData([]);
      }

      setStats(results);
      setCampaignStats(campResults);
      setDebugInfo(debug);
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  }, [apiSettings]);

  useEffect(() => { fetchAll(); }, [fetchAll]);

  // ─── Stat Row ───
  const StatGrid = ({ s, compact }) => {
    const fs = compact ? 14 : 18;
    return (
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6 }}>
        <div style={{ background: theme.surfaceLight, borderRadius: 10, padding: compact ? "8px 6px" : "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 9, color: theme.textDim, fontWeight: 600, marginBottom: 3 }}>노출수</div>
          <div style={{ fontSize: compact ? 12 : 14, fontWeight: 800, color: theme.text }}>{typeof s.impCnt === "number" ? fmtNum(s.impCnt) : s.impCnt}</div>
        </div>
        <div style={{ background: theme.surfaceLight, borderRadius: 10, padding: compact ? "8px 6px" : "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 9, color: theme.textDim, fontWeight: 600, marginBottom: 3 }}>클릭수</div>
          <div style={{ fontSize: fs, fontWeight: 800, color: theme.accent }}>{typeof s.clkCnt === "number" ? fmtNum(s.clkCnt) : s.clkCnt}</div>
        </div>
        <div style={{ background: theme.surfaceLight, borderRadius: 10, padding: compact ? "8px 6px" : "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 9, color: theme.textDim, fontWeight: 600, marginBottom: 3 }}>평균CPC</div>
          <div style={{ fontSize: compact ? 11 : 13, fontWeight: 800, color: theme.text }}>{typeof s.cpc === "number" ? `${fmtNum(s.cpc)}원` : s.cpc}</div>
        </div>
        <div style={{ background: theme.surfaceLight, borderRadius: 10, padding: compact ? "8px 6px" : "12px 8px", textAlign: "center" }}>
          <div style={{ fontSize: 9, color: theme.textDim, fontWeight: 600, marginBottom: 3 }}>총비용</div>
          <div style={{ fontSize: compact ? 11 : 13, fontWeight: 800, color: theme.danger }}>{typeof s.salesAmt === "number" ? `${fmtNum(s.salesAmt)}원` : s.salesAmt}</div>
        </div>
      </div>
    );
  };

  // ─── Period Card ───
  const StatCard = ({ period }) => {
    const s = stats[period.key];
    const hasError = s?.error;
    const isExpanded = expandedPeriod === period.key;
    const campData = campaignStats[period.key] || {};

    return (
      <Card style={{ marginBottom: 12, padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 15, fontWeight: 800, color: theme.text }}>{period.label}</div>
          {s && !hasError && campaigns.length > 1 && (
            <button onClick={() => setExpandedPeriod(isExpanded ? null : period.key)} style={{
              background: isExpanded ? theme.accentDim : theme.surfaceLight,
              border: `1px solid ${isExpanded ? theme.accent + "33" : "transparent"}`,
              borderRadius: 8, padding: "4px 10px", fontSize: 11, fontWeight: 700,
              color: isExpanded ? theme.accent : theme.textDim, cursor: "pointer",
            }}>
              {isExpanded ? "접기" : `캠페인별 (${campaigns.length})`}
            </button>
          )}
        </div>

        {hasError ? (
          <div style={{ fontSize: 12, color: theme.danger, padding: 10, background: theme.dangerDim, borderRadius: 8, lineHeight: 1.5 }}>
            조회 실패: {s.error}
            <br/><span style={{ fontSize: 11, color: theme.textDim }}>해당 기간에 데이터가 없을 수 있습니다</span>
          </div>
        ) : !s ? (
          <div style={{ height: 60, background: theme.surfaceLight, borderRadius: 10, animation: "pulse 1.5s ease-in-out infinite" }} />
        ) : (
          <>
            <StatGrid s={s} />

            {/* 캠페인별 분리 */}
            {isExpanded && (
              <div style={{ marginTop: 12, borderTop: `1px solid ${theme.border}`, paddingTop: 12 }}>
                {campaigns.filter(c => {
                  const cs = campData[c.nccCampaignId];
                  return cs && cs.salesAmt > 0;
                }).map(c => {
                  const cs = campData[c.nccCampaignId];
                  return (
                    <div key={c.nccCampaignId} style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 6, display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 4, height: 4, borderRadius: "50%", background: theme.accent, display: "inline-block" }} />
                        {c.name}
                      </div>
                      <StatGrid s={cs} compact />
                    </div>
                  );
                })}
                {campaigns.filter(c => { const cs = campData[c.nccCampaignId]; return cs && cs.salesAmt > 0; }).length === 0 && (
                  <div style={{ textAlign: "center", padding: 12, color: theme.textDim, fontSize: 12 }}>비용이 발생한 캠페인이 없습니다</div>
                )}
              </div>
            )}
          </>
        )}
      </Card>
    );
  };

  return (
    <div style={{ minHeight: "100vh", padding: "0 20px 80px" }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 0 16px", position: "sticky", top: 0, zIndex: 10, background: `linear-gradient(${theme.bg}, ${theme.bg}ee)`, backdropFilter: "blur(12px)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: `linear-gradient(135deg, ${theme.accent}, ${theme.accentDark})`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 2px 8px ${theme.accentGlow}` }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.27 3H7.73A4.73 4.73 0 0 0 3 7.73v8.54A4.73 4.73 0 0 0 7.73 21h8.54A4.73 4.73 0 0 0 21 16.27V7.73A4.73 4.73 0 0 0 16.27 3zm-2.1 12.27h-2.4l-2.6-3.6v3.6H6.97V8.73h2.4l2.6 3.56V8.73h2.2v6.54z"/></svg>
          </div>
          <div>
            <div style={{ fontSize: 17, fontWeight: 800, color: theme.text }}>광고비</div>
            <div style={{ fontSize: 11, color: theme.textDim, fontWeight: 500 }}>{user.name}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={fetchAll} style={{ background: theme.surface, border: `1.5px solid ${theme.border}`, borderRadius: 10, width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: theme.accent, boxShadow: theme.cardShadow }}>{I.refresh}</button>
        </div>
      </div>

      {/* Loading */}
      {loading && (
        <div>
          {[1,2,3,4].map(i => (
            <Card key={i} style={{ marginBottom: 12, padding: 16 }}>
              <div style={{ height: 16, width: 60, background: theme.surfaceLight, borderRadius: 8, marginBottom: 14, animation: "pulse 1.5s ease-in-out infinite" }} />
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6 }}>
                {[1,2,3,4].map(j => <div key={j} style={{ height: 50, background: theme.surfaceLight, borderRadius: 10, animation: "pulse 1.5s ease-in-out infinite" }} />)}
              </div>
            </Card>
          ))}
          <style>{`@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }`}</style>
        </div>
      )}

      {/* Error */}
      {error && (
        <Card style={{ padding: 20, textAlign: "center" }}>
          <div style={{ fontSize: 30, marginBottom: 10 }}>⚠️</div>
          <div style={{ fontSize: 14, color: theme.danger, fontWeight: 600, marginBottom: 6 }}>연결 오류</div>
          <div style={{ fontSize: 12, color: theme.textDim, marginBottom: 16, lineHeight: 1.5 }}>{error}</div>
          <Button onClick={fetchAll} variant="secondary">다시 시도</Button>
        </Card>
      )}

      {/* Daily Chart */}
      {!loading && !error && dailyData.length > 1 && (
        <Card style={{ marginBottom: 12, padding: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 800, color: theme.text, marginBottom: 4 }}>이번달 일별 비용 추이</div>
          <div style={{ fontSize: 11, color: theme.textDim, marginBottom: 8 }}>
            총 {fmtNum(dailyData.reduce((s, d) => s + d.salesAmt, 0))}원
          </div>
          <MiniChart data={dailyData.map(d => ({ value: d.salesAmt, label: d.label }))} color={theme.danger} height={50} />
          <div style={{ marginTop: 6 }}>
            <div style={{ fontSize: 11, color: theme.textDim, marginBottom: 4 }}>일별 클릭수</div>
            <MiniChart data={dailyData.map(d => ({ value: d.clkCnt, label: d.label }))} color={theme.accent} height={40} />
          </div>
        </Card>
      )}

      {/* Period Cards */}
      {!loading && !error && periods.map(p => (
        <StatCard key={p.key} period={p} />
      ))}

      {/* Debug Panel */}
      {!loading && Object.keys(debugInfo).length > 0 && (
        <DebugPanel debugInfo={debugInfo} />
      )}
    </div>
  );
}

function DebugPanel({ debugInfo }) {
  const [show, setShow] = useState(false);
  return (
    <div style={{ marginTop: 12 }}>
      <button onClick={() => setShow(!show)} style={{ background: "none", border: "none", color: theme.textDim, fontSize: 11, cursor: "pointer", fontWeight: 600, padding: "4px 0" }}>
        {show ? "▼ 디버그 닫기" : "▶ API 응답 확인 (디버그)"}
      </button>
      {show && (
        <Card style={{ padding: 12, marginTop: 8, background: "#f8f8fa" }}>
          <pre style={{ fontSize: 10, color: theme.text, whiteSpace: "pre-wrap", wordBreak: "break-all", maxHeight: 400, overflow: "auto", margin: 0, fontFamily: "'JetBrains Mono', monospace", lineHeight: 1.5 }}>
            {JSON.stringify(debugInfo, null, 2)}
          </pre>
        </Card>
      )}
    </div>
  );
}

// ─── App ───
function App() {
  const [page, setPage] = useState("loading");
  const [tab, setTab] = useState("campaigns");
  const [user, setUser] = useState(null);
  const [toast, setToast] = useState(null);
  const [apiSettings, setApiSettings] = useState(null);

  const showToast = useCallback((message, type = "success") => setToast({ message, type }), []);

  // ─── 자동 로그인 ───
  useEffect(() => {
    const savedSession = localStorage.getItem("naver-ad-session");
    if (savedSession) {
      try {
        const sessionUser = JSON.parse(savedSession);
        const users = JSON.parse(localStorage.getItem("naver-ad-users") || "[]");
        const valid = users.find(u => u.id === sessionUser.id && u.email === sessionUser.email);
        if (valid) {
          setUser(valid);
          const apiData = localStorage.getItem(`naver-ad-api-settings-${valid.id}`);
          if (apiData) {
            setApiSettings(JSON.parse(apiData));
            setPage("main");
          } else {
            setPage("settings");
          }
          return;
        }
      } catch (e) {}
    }
    setPage("login");
  }, []);

  const handleLogin = useCallback((u) => {
    setUser(u);
    localStorage.setItem("naver-ad-session", JSON.stringify({ id: u.id, email: u.email }));
    const apiData = localStorage.getItem(`naver-ad-api-settings-${u.id}`);
    if (apiData) {
      setApiSettings(JSON.parse(apiData));
      setPage("main");
    } else {
      setPage("settings");
    }
    showToast(`${u.name}님 환영합니다!`);
  }, [showToast]);

  const handleLogout = useCallback(() => {
    setUser(null);
    setApiSettings(null);
    localStorage.removeItem("naver-ad-session");
    setPage("login");
    showToast("로그아웃 되었습니다", "info");
  }, [showToast]);

  const handleApiSave = useCallback((s) => {
    setApiSettings(s);
    showToast("API 설정 저장 완료!");
    setTimeout(() => setPage("main"), 600);
  }, [showToast]);

  if (page === "loading") {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: theme.bg, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 16 }}>
        <div style={{ width: 64, height: 64, borderRadius: 18, background: `linear-gradient(135deg, ${theme.accent}, ${theme.accentDark})`, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 8px 28px ${theme.accentGlow}` }}>{I.naver}</div>
        <div style={{ width: 24, height: 24, border: `3px solid ${theme.accent}`, borderTopColor: "transparent", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} />
        <style>{`@keyframes spin { to { transform: rotate(360deg) } }`}</style>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: theme.bg, color: theme.text, position: "relative" }}>
      <SoftBG />
      {toast && <Toast {...toast} onClose={() => setToast(null)} />}
      <div style={{ position: "relative", zIndex: 1 }}>
        {page === "login" && <LoginPage onLogin={handleLogin} onGoSignup={() => setPage("signup")} />}
        {page === "signup" && <SignupPage onSignup={handleLogin} onGoLogin={() => setPage("login")} />}
        {page === "settings" && user && <ApiSettingsPage user={user} apiSettings={apiSettings} onLogout={handleLogout} onSave={handleApiSave} onGoCampaigns={() => setPage("main")} />}
        {page === "main" && user && apiSettings && tab === "campaigns" && <CampaignsPage user={user} apiSettings={apiSettings} onLogout={handleLogout} showToast={showToast} />}
        {page === "main" && user && apiSettings && tab === "cost" && <CostPage user={user} apiSettings={apiSettings} onLogout={handleLogout} showToast={showToast} />}
        {page === "main" && user && apiSettings && tab === "settings" && <ApiSettingsPage user={user} apiSettings={apiSettings} onLogout={handleLogout} onSave={(s) => { setApiSettings(s); showToast("API 설정이 저장되었습니다!"); }} onGoCampaigns={() => setTab("campaigns")} />}
        {page === "main" && user && apiSettings && <TabBar active={tab} onChange={setTab} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
